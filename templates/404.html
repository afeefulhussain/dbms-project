{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="fa-solid fa-triangle-exclamation fa-4x text-warning mb-3"></i>
        <h1 class="fw-bold">404 - Page Not Found</h1>
        <p class="text-muted lead">The page you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-custom px-4 py-2 mt-2">
            <i class="fa-solid fa-house me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
